# Deploy FOMO to Azure: a single Storage Account (Table Storage + static website)
#
# Trigger: push to main  /  manual dispatch
#
# Auth: Workload Identity Federation (no secrets needed for Azure login)
#   Managed Identity: fomo-github-actions (in fomo RG) — needs Contributor on the
#   resource group (deploys Bicep and lists the storage key to upload the site).
#
# Required GitHub secrets (or variables):
#   AZURE_CLIENT_ID
#   AZURE_TENANT_ID
#   AZURE_SUBSCRIPTION_ID

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write   # required for OIDC login
  contents: read

env:
  PROJECT: fomo
  LOCATION: swedencentral
  NODE_VERSION: "22"

jobs:
  # ── Build & Test ────────────────────────────────────────────────────────────
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

  # ── Deploy ──────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: build-test
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy
        run: bash deploy.sh ${{ env.PROJECT }} ${{ env.LOCATION }} --yes

# Deploy FOMO to Azure Container Apps
#
# Trigger: push to main
#
# Required secrets:
#   AZURE_CREDENTIALS         — Service principal JSON (az ad sp create-for-rbac --sdk-auth)
#   AZURE_RESOURCE_GROUP      — Target resource group name
#   GOOGLE_CLIENT_ID          — Google OAuth 2.0 Client ID
#   GOOGLE_CLIENT_SECRET      — Google OAuth 2.0 Client Secret
#   SESSION_SECRET            — Random string (≥32 chars) for signing session cookies
#
# Required variables (optional overrides):
#   AZURE_LOCATION            — Azure region (default: swedencentral)

name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT: fomo
  NODE_VERSION: "20"

jobs:
  # ── Build & Test ────────────────────────────────────────────────────────────
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: |
            packages/core/dist/
            packages/web/dist/
          retention-days: 1

  # ── Deploy ──────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: build-test
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set variables
        id: vars
        run: |
          RG="${{ secrets.AZURE_RESOURCE_GROUP }}"
          LOCATION="${{ vars.AZURE_LOCATION || 'swedencentral' }}"
          echo "rg=$RG" >> "$GITHUB_OUTPUT"
          echo "location=$LOCATION" >> "$GITHUB_OUTPUT"

      - name: Ensure resource group
        run: |
          az group create \
            --name "${{ steps.vars.outputs.rg }}" \
            --location "${{ steps.vars.outputs.location }}" \
            --output none

      # Bootstrap: create registry first so we can push the image
      - name: Deploy container registry
        id: registry
        run: |
          OUT=$(az deployment group create \
            --resource-group "${{ steps.vars.outputs.rg }}" \
            --name "bootstrap-${{ github.run_number }}" \
            --template-file infra/bootstrap.bicep \
            --parameters projectName="${{ env.PROJECT }}" location="${{ steps.vars.outputs.location }}" \
            --output json)
          echo "login_server=$(echo "$OUT" | jq -r '.properties.outputs.loginServer.value')" >> "$GITHUB_OUTPUT"

      - name: Log in to ACR
        run: az acr login --name "${{ steps.registry.outputs.login_server }}"

      - name: Build & push Docker image
        run: |
          IMAGE="${{ steps.registry.outputs.login_server }}/${{ env.PROJECT }}:${{ github.sha }}"
          IMAGE_LATEST="${{ steps.registry.outputs.login_server }}/${{ env.PROJECT }}:latest"
          docker build -t "$IMAGE" -t "$IMAGE_LATEST" -f Dockerfile .
          docker push "$IMAGE"
          docker push "$IMAGE_LATEST"

      # Full infra deployment
      - name: Deploy infrastructure
        id: infra
        run: |
          OUT=$(az deployment group create \
            --resource-group "${{ steps.vars.outputs.rg }}" \
            --template-file infra/main.bicep \
            --parameters infra/main.bicepparam \
            --parameters googleClientId="${{ secrets.GOOGLE_CLIENT_ID }}" \
                         googleClientSecret="${{ secrets.GOOGLE_CLIENT_SECRET }}" \
                         sessionSecret="${{ secrets.SESSION_SECRET }}" \
                         location="${{ steps.vars.outputs.location }}" \
            --output json)
          echo "url=$(echo "$OUT" | jq -r '.properties.outputs.url.value')" >> "$GITHUB_OUTPUT"

      # Force new revision with the exact SHA-tagged image
      - name: Update Container App
        run: |
          az containerapp update \
            --resource-group "${{ steps.vars.outputs.rg }}" \
            --name "${{ env.PROJECT }}-app" \
            --image "${{ steps.registry.outputs.login_server }}/${{ env.PROJECT }}:${{ github.sha }}" \
            --output none

      - name: Deployment summary
        run: |
          echo "### ✅ Deployed successfully" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**URL:** ${{ steps.infra.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Image:** \`${{ env.PROJECT }}:${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"

# Deploy FOMO to Azure Container Apps
#
# Trigger: push to main  /  manual dispatch
#
# Auth: Workload Identity Federation (no secrets needed for Azure login)
#   Managed Identity: fomo-github-actions (in fomo RG)
#
# Required GitHub secrets:
#   GOOGLE_CLIENT_ID          — Google OAuth 2.0 Client ID
#   GOOGLE_CLIENT_SECRET      — Google OAuth 2.0 Client Secret
#   SESSION_SECRET            — Random string (≥32 chars) for session cookies
#   ALLOWED_USERS             — Comma-separated allowed emails e.g. "a@b.com,c@d.com"
#
# Required GitHub variables (Settings → Variables):
#   AZURE_CLIENT_ID           — <client-id>
#   AZURE_TENANT_ID           — <tenant-id>
#   AZURE_SUBSCRIPTION_ID     — <subscription-id>

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write   # required for OIDC login
  contents: read

env:
  PROJECT: fomo
  LOCATION: swedencentral
  NODE_VERSION: "20"

jobs:
  # ── Build & Test ────────────────────────────────────────────────────────────
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

  # ── Deploy ──────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: build-test
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          ALLOWED_USERS: ${{ secrets.ALLOWED_USERS }}
        run: bash deploy.sh fomo ${{ env.LOCATION }} --yes
